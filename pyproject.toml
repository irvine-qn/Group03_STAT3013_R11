[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodbench"
version = "0.1.0"
description = "Fair comparison of statistical and ML models for flood extent forecasting"
requires-python = ">=3.10"
# Thư viện chạy nằm trong requirements.txt (đã ghim phiên bản)

[tool.setuptools.packages.find]
where = ["src"]
include = ["floodbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
